name: Feature request
description: Suggest a new capability or an improvement to this skill package
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues and the CHANGELOG first - the capability
        may already exist or be planned.
  - type: textarea
    id: scenario
    attributes:
      label: User scenario
      description: What are you trying to accomplish that the package cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior you want, not the implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried and why they fall short.
  - type: dropdown
    id: tier-impact
    attributes:
      label: Scale-tier impact
      description: See references/scaling.md for the tier ladder and the T1-T4 thresholds.
      options:
        - Unknown
        - No tier change
        - micro only
        - Affects the small tier
        - Affects medium or above
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submit checklist
      options:
        - label: I searched existing issues and the CHANGELOG for this request.
          required: true
        - label: This request does not weaken any red line in README-FOR-AI.md (P1-P55).
          required: true
